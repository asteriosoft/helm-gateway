# One Gateway on an already existing GatewayClass and one route behind it.
gateways:
  public:
    spec:
      gatewayClassName: my-gateway-class
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: All

routes:
  app:
    spec:
      parentRefs:
        - name: public
      hostnames:
        - app.example.com
      rules:
        - backendRefs:
            - name: app
              port: 80
