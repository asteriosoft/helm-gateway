# Envoy Gateway behind an AWS Network Load Balancer that terminates TLS (created by the AWS Load Balancer Controller).
# Port 80 only serves the https redirect, port 443 carries the applications (plain HTTP inside the cluster).
gatewayClass:
  name: envoy

httpsRedirect:
  enabled: true

envoy:
  enabled: true
  replicas: 2
  pdb:
    minAvailable: 1
  requestTimeout: 60s
  allowUnderscoresInHeaders: true
  service:
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:REGION:ACCOUNT:certificate/ID
