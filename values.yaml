# -- Override the chart name used in the `app.kubernetes.io/name` label
nameOverride: ""

# -- Labels added to every rendered object
commonLabels: {}

# -- Annotations added to every rendered object
commonAnnotations: {}

gatewayClass:
  # -- Create a GatewayClass. Set to false to use a class that already exists (see `gateway.className`)
  create: true
  # -- GatewayClass name (defaults to the release name)
  name: ""
  # -- Controller that implements the class (default: Envoy Gateway)
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # -- GatewayClass description
  description: ""
  # -- Reference to implementation specific configuration (group, kind, name, namespace). Set automatically to the
  # EnvoyProxy of this chart when `envoy.enabled` is true
  parametersRef: {}
  # -- Extra labels of the GatewayClass
  labels: {}
  # -- Extra annotations of the GatewayClass
  annotations: {}

gateway:
  # -- Gateway name (defaults to the release name)
  name: ""
  # -- GatewayClass of the Gateway (defaults to the class created by this chart)
  className: ""
  # -- Listeners. `protocol` defaults to HTTP and `allowedRoutes` to routes from all namespaces. Optional per listener:
  # `hostname`, `tls`, `allowedRoutes`. TLS is usually terminated by the load balancer in front, so both listeners
  # speak plain HTTP inside the cluster
  listeners:
    - name: http
      port: 80
    - name: https
      port: 443
  # -- `spec.infrastructure` of the Gateway (labels, annotations, parametersRef), needs Gateway API 1.1 or newer
  infrastructure: {}
  # -- `spec.addresses` of the Gateway
  addresses: []
  # -- Extra labels of the Gateway
  labels: {}
  # -- Extra annotations of the Gateway
  annotations: {}

httpsRedirect:
  # -- Redirect every request that arrives on the plain-http listener to https (one HTTPRoute for all hosts)
  enabled: false
  # -- Name of the plain-http listener the redirect route attaches to
  listener: http
  # -- Port of the https redirect target (omit to use the default https port)
  port: 443
  # -- Redirect status code
  statusCode: 308

# -- Extra HTTPRoutes of the platform (for example a maintenance page), keyed by name. Routes of applications belong
# to the application charts. Every item takes `spec` (the HTTPRoute spec as in the Gateway API; `parentRefs` defaults
# to this Gateway) and optionally `labels`, `annotations` and `namespace`
routes: {}
  # maintenance:
  #   spec:
  #     hostnames: ["maintenance.example.com"]
  #     rules:
  #       - backendRefs:
  #           - name: maintenance-page
  #             port: 80

# -- Free-form manifests, as strings or maps, rendered with `tpl`. For anything the options above cannot express
# (for example an Envoy Gateway SecurityPolicy)
extraObjects: []
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: {{ .Release.Name }}-extra
  #   data:
  #     key: value
