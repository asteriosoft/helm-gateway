# -- Override the chart name used in the `app.kubernetes.io/name` label
nameOverride: ""

# -- Labels added to every rendered object
commonLabels: {}

# -- Annotations added to every rendered object
commonAnnotations: {}

gatewayClass:
  # -- Create a GatewayClass
  create: false
  # -- GatewayClass name (defaults to the release name). Also the default `spec.gatewayClassName` of the gateways below
  name: ""
  # -- Controller that implements the class, e.g. `gateway.envoyproxy.io/gatewayclass-controller` (required when `create` is true)
  controllerName: ""
  # -- GatewayClass description
  description: ""
  # -- Reference to implementation specific configuration (group, kind, name, namespace), e.g. an Envoy Gateway EnvoyProxy
  parametersRef: {}
  # -- Extra labels of the GatewayClass
  labels: {}
  # -- Extra annotations of the GatewayClass
  annotations: {}

# -- Gateways, keyed by name. A map (not a list) so values files of different environments can be merged.
# Every item takes `spec` (the Gateway spec exactly as in the Gateway API), and optionally `enabled` (default true),
# `name` (default: the key), `namespace`, `labels`, `annotations` and `apiVersion`.
# `spec.gatewayClassName` defaults to `gatewayClass.name` (or the release name when `gatewayClass.create` is true).
# Strings in `spec` are rendered with `tpl`, so `{{ .Release.Name }}` and other chart values can be used.
gateways: {}
  # public:
  #   annotations: {}
  #   spec:
  #     listeners:
  #       - name: http
  #         port: 80
  #         protocol: HTTP
  #         allowedRoutes:
  #           namespaces:
  #             from: All
  #     infrastructure:
  #       annotations:
  #         service.beta.kubernetes.io/aws-load-balancer-type: external

# -- Default `spec.parentRefs` of the routes that do not set their own, usually a reference to a Gateway
defaultParentRefs: []
  # - name: public
  #   namespace: gateway-system
  #   sectionName: https

# -- Routes, keyed by name. Every item takes `spec` (the route spec exactly as in the Gateway API), and optionally
# `kind` (default `HTTPRoute`, also `GRPCRoute`, `TLSRoute`, `TCPRoute`, `UDPRoute`), `apiVersion` (default
# `gateway.networking.k8s.io/v1`; experimental kinds use `v1alpha2`), `enabled` (default true), `name` (default: the key),
# `namespace`, `labels` and `annotations`. Strings in `spec` are rendered with `tpl`.
routes: {}
  # https-redirect:
  #   spec:
  #     parentRefs:
  #       - name: public
  #         sectionName: http
  #     rules:
  #       - filters:
  #           - type: RequestRedirect
  #             requestRedirect:
  #               scheme: https
  #               statusCode: 308
  # app:
  #   spec:
  #     hostnames: ["app.example.com"]
  #     rules:
  #       - backendRefs:
  #           - name: app
  #             port: 80

# -- Any other namespaced custom resource, keyed by name: implementation specific objects such as an Envoy Gateway
# EnvoyProxy, ClientTrafficPolicy, BackendTrafficPolicy or SecurityPolicy, or a ReferenceGrant. Every item needs
# `apiVersion`, `kind` and takes `spec`, and optionally `enabled`, `name`, `namespace`, `labels` and `annotations`.
# Strings in `spec` are rendered with `tpl`.
objects: {}
  # backend-timeout:
  #   apiVersion: gateway.envoyproxy.io/v1alpha1
  #   kind: BackendTrafficPolicy
  #   spec:
  #     targetRefs:
  #       - group: gateway.networking.k8s.io
  #         kind: Gateway
  #         name: public
  #     timeout:
  #       http:
  #         requestTimeout: 60s

# -- Free-form manifests, as strings or maps, rendered with `tpl`. For anything the sections above cannot express
extraObjects: []
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: {{ .Release.Name }}-extra
  #   data:
  #     key: value
