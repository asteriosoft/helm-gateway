{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  {{- include "gateway.metadata" (dict "ctx" $ "name" (include "gateway.className" $) "item" .Values.gatewayClass) | nindent 2 }}
spec:
  controllerName: {{ required "gatewayClass.controllerName is required when gatewayClass.create is true" .Values.gatewayClass.controllerName }}
  {{- with .Values.gatewayClass.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if .Values.gatewayClass.parametersRef }}
  parametersRef:
    {{- toYaml .Values.gatewayClass.parametersRef | nindent 4 }}
  {{- else if .Values.envoy.enabled }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "gateway.envoyName" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
