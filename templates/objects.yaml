{{- range $name, $item := .Values.objects }}
{{- $item = $item | default dict }}
{{- if include "gateway.enabled" $item }}
---
apiVersion: {{ required (printf "objects.%s.apiVersion is required" $name) $item.apiVersion }}
kind: {{ required (printf "objects.%s.kind is required" $name) $item.kind }}
metadata:
  {{- include "gateway.metadata" (dict "ctx" $ "name" $name "item" $item) | nindent 2 }}
{{- with $item.spec }}
spec:
  {{- tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
